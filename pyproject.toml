[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-transaction-replacement-policy"
version = "0.1.0"
description = "Model per-account nonce replacements with integer percentage fee bumps and explicit rejection reasons."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-transaction-replacement-policy = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
